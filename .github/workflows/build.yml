name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name SumowanieSkladnikow sumowanie_skladnikow.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: SumowanieSkladnikow-Windows
          path: dist/SumowanieSkladnikow.exe
