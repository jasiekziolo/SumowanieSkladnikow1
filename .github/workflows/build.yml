name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Zainstaluj Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zainstaluj biblioteki
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl
          pip install pyinstaller

      - name: Zbuduj EXE
        run: |
          pyinstaller --onefile --windowed --name SumowanieSkladnikowMulti sumowanie_skladnikow.py

      - name: Udostępnij gotowy EXE
        uses: actions/upload-artifact@v4
        with:
          name: SumowanieSkladnikowMulti-Windows
          path: dist/SumowanieSkladnikowMulti.exe
