name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Zainstaluj Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zainstaluj biblioteki
        run: |
          python -m pip install --upgrade pip
          python -m pip install openpyxl
          python -m pip install tkinterdnd2
          python -m pip install pyinstaller

      - name: Sprawdź biblioteki
        run: |
          python -c "import tkinterdnd2; print('tkinterdnd2 OK')"
          python -c "import openpyxl; print('openpyxl OK')"

      - name: Zbuduj aplikację
        run: |
          pyinstaller --clean --noconfirm SumowanieSkladnikow.spec

      - name: Spakuj aplikację
        shell: powershell
        run: |
          Compress-Archive `
            -Path "dist\SumowanieSkladnikow\*" `
            -DestinationPath "dist\SumowanieSkladnikow-Windows-onedir.zip" `
            -Force

      - name: Udostępnij aplikację
        uses: actions/upload-artifact@v4
        with:
          name: SumowanieSkladnikow-Windows-onedir
          path: dist/SumowanieSkladnikow-Windows-onedir.zip
