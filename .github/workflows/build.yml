name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Zainstaluj Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zainstaluj biblioteki
        run: |
          python -m pip install --upgrade pip
          python -m pip install openpyxl
          python -m pip install tkinterdnd2
          python -m pip install pyinstaller

      - name: Sprawdź tkinterdnd2
        run: |
          python -c "import tkinterdnd2; print('tkinterdnd2 OK')"

      - name: Zbuduj EXE
        run: |
          pyinstaller --onefile --windowed --clean --noconfirm --name SumowanieSkladnikow --collect-all tkinterdnd2 sumowanie_skladnikow.py

      - name: Udostępnij EXE
        uses: actions/upload-artifact@v4
        with:
          name: SumowanieSkladnikow-Windows
          path: dist/SumowanieSkladnikow.exe
